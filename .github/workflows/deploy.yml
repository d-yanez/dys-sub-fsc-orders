name: Deploy cr-dys-sub-fsc-orders-prd

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: prd-dyshopnow
  REGION: us-central1
  ARTIFACT_REGISTRY: ar-cloudrun-prd
  IMAGE_NAME: dys-sub-fsc-orders
  CLOUD_RUN_SERVICE: cr-dys-sub-fsc-orders-prd
  DEPLOY_SERVICE_ACCOUNT: sa-deploy-cloudrun-prd@prd-dyshopnow.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: sa-run-dys-sub-fsc-orders-prd@prd-dyshopnow.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/785293986978/locations/global/workloadIdentityPools/wip-github-prd/providers/wiprov-github-dyshopnow

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go mod tidy
        run: go mod tidy

      - name: Verify Go build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" .
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${IMAGE_URI}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --cpu 0.5 \
            --memory 256Mi \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 2 \
            --quiet
